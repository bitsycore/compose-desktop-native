org.gradle.jvmargs=-Xmx4096M
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.code.style=official

kotlin.mpp.enableCInteropCommonization=true
kotlin.native.enableKlibsCrossCompilation=false
# Per-file native incremental compilation MUST stay off: it fails to emit a
# value class's box/unbox helpers into the declaring file's cache unit when only
# OTHER files box the value, so the final executable link dies with undefined
# symbols (e.g. androidx.compose.material3.NavigationItemIconPosition's box
# constructor, referenced from ShortNavigationBar/WideNavigationRail). Turning it
# on breaks :demo / :apidemo executable linking on all native targets.
kotlin.incremental.native=false
kotlin.native.ignoreDisabledTargets=true

org.jetbrains.compose.experimental.macos.enabled=true

subsetIcons=true
compressResources=true

# :demo and :apidemo apply the bridge plugin for data.kres packaging (+ the
# apidemo app icon), but IN-REPO the official Compose coords must substitute to
# PROJECT modules (the root build's FULL-COMMONIZATION BRIDGE) — not to
# published com.bitsycore.compose.sdl klibs. Keep the plugin's substitution
# half off.
composeDesktopNative.substitution=false
