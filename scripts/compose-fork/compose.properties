# Pinned upstream refs for the vendored Compose sources. Referenced from each
# module's compose-fork.txt as SET_REPO=<url>@<VARNAME>. Bump a ref here and
# re-run scripts/compose-fork/sync.sh to re-sync everything to it.

# JetBrains/compose-multiplatform-core -- pinned to the durable TAG (fetchable by name
# from any fresh clone, unlike a bare unreferenced SHA which upstream could GC).
# 2026-09-22: v1.12.1. Both repos carry a clean `v1.12.1` tag and the matching
# artifacts are on Maven Central, so the native (vendored) side and the JVM
# parity leg stay in lockstep - no dev-build skew to document. The JVM forcing
# lives in gradle/libs.versions.toml (`compose`), which must stay equal to this
# ref's base version. skiko is unchanged at 0.150.1, so the mingw fork still
# matches its Skia base.
COMPOSE_CORE_REF=v1.12.1

# JetBrains/compose-multiplatform  (umbrella repo -- :components-resources runtime)
COMPOSE_REF=v1.12.1

# InsertKoinIO/koin -- the DI layer. koin-core itself publishes mingwX64 + linux
# klibs and is consumed from Maven as-is; only the viewmodel / compose modules
# stop at apple+android upstream, so those are vendored.
KOIN_REF=4.2.2

# coil-kt/coil -- image loading. coil-core / coil / coil-svg / coil-network-*
# publish linux but NOT mingwX64; the compose layer publishes neither. The code
# is target-agnostic, so vendoring is mostly re-declaring the targets.
COIL_REF=3.6.3

# bitsycore/pulse-mvi -- the MVI layer. Targets android / jvm / ios / js / wasm
# upstream, with NO macos / linux / mingw, so all four modules are vendored.
PULSE_REF=0.3.7
