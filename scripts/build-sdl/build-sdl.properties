# Version manifest for scripts/build-sdl/build-all.py — the one place to bump the
# static SDL3 that build-all.py builds into <repo>/libs/.
#
# (SDL3_ttf / SDL3_image / FreeType are no longer built — the project renders
# through Skia now, so the SDL renderer and its glyph/image codecs were removed.)
#
# Format:  KEY=value            — base value, applies to every host
#          KEY_macos=value      — per-host override (macos / linux / windows)
#          KEY_linux=value        The suffix matches BUILD_SDL_HOST as reported
#          KEY_windows=value      by detect_host.
#
# Precedence (highest first):
#   1. Environment variable of the same name  (e.g. SDL_REF=main python build-all.py)
#   2. KEY_<host> in this file                (only when host matches)
#   3. KEY in this file
#
# Empty values are treated as "not set" — the next rung of the ladder applies.

# ==================
# MARK: SDL3 — windowing / input / platform
# ==================
SDL_URL=https://github.com/libsdl-org/SDL.git
SDL_REF=release-3.4.14
