[versions]
kotlin = "2.4.0"
# Official Compose Multiplatform versions the port's vendored sources track and
# the JVM parity leg forces. SINGLE SOURCE: consumed by the bridge plugin
# (stamped into bridge-version.properties and exposed to consumers) and by
# demo / apidemo / material-symbols. Keep in lockstep with the vendored ref in
# scripts/compose-fork/compose.properties on each bump.
#   compose          = ui / foundation / animation / material
#   composeMaterial3 = material3 (versioned separately upstream)
#   composeRuntime   = the official runtime klibs (never substituted)
compose = "1.12.0"
# material3 rides its own release train upstream: 1.12.0-alpha03 IS the version
# Compose Multiplatform 1.12.0 ships (Jetpack material3 1.5.0-alpha22).
composeMaterial3 = "1.12.0-alpha03"
composeRuntime = "1.12.0"
kotlinxCoroutines = "1.11.0"
kotlinxDateTime = "0.8.0"
kotlinxSerialization = "1.11.0"
okio = "3.17.0"
kotlinxIoOkio = "0.9.1"
ktor = "3.5.1"
koin = "4.2.2"
coil = "3.6.2"
androidxLifecycle = "2.11.0"
navigation3Runtime = "1.2.0-alpha05"
skiko = "0.150.1"
# The bitsycore skiko FORK for mingwX64 (skiko+Skia in skiko-windows-x64.dll).
# Same Skia base as `skiko` above - keep the `-mingw.N` suffix's base in lockstep.
# Overridable per-build with -PskikoMingwVersion.
skikoMingw = "0.150.1-mingw.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDateTime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
# coil-network-ktor3 bridges ktor's kotlinx-io sinks onto okio.
kotlinx-io-okio = { module = "org.jetbrains.kotlinx:kotlinx-io-okio", version.ref = "kotlinxIoOkio" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }
# koin-core publishes mingwX64 + linux klibs - consumed from Maven as-is; only the
# viewmodel / compose layers are vendored (see koin/).
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
# GOOGLE lifecycle coordinates, matching the rest of the port. Upstream koin uses the
# org.jetbrains.androidx.* mirrors; mixing both would duplicate the same classes.
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3Runtime" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }